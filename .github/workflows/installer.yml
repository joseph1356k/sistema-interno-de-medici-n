# Construye el instalador del agente.
#
# El .exe se compila aquí y no en el portátil de nadie, para que el binario que se
# reparte a todos los PCs sea reproducible y auditable.
#
# Se ejecuta a mano (workflow_dispatch) o al publicar una etiqueta `agente-vX.Y.Z`.

name: Construir instalador

on:
  workflow_dispatch:
    inputs:
      collector_version:
        description: 'Versión de otelcol-contrib (vacío = última)'
        required: false
        default: ''
      agent_version:
        description: 'Versión del agente (ej. 1.0.0)'
        required: false
        default: '0.1.0'
  push:
    tags:
      - 'agente-v*'

permissions:
  contents: read

jobs:
  # Trabajo aparte y rápido: valida la sintaxis del .iss en cada ejecución, para que
  # un error de sintaxis no se descubra al final de una construcción larga.
  validar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que las plantillas referenciadas existen
        shell: pwsh
        run: |
          $requeridos = @(
            'agent/otelcol/config.yaml',
            'agent/windows/managed-settings.json',
            'agent/windows/codex-config.toml',
            'installer/scripts/configure.ps1',
            'installer/scripts/revert.ps1',
            'installer/aviso.txt',
            'PRIVACY.md'
          )
          $faltan = $requeridos | Where-Object { -not (Test-Path $_) }
          if ($faltan) { throw "Faltan archivos que el instalador referencia: $($faltan -join ', ')" }
          Write-Host 'Todas las plantillas están presentes.'

      - name: Comprobar la codificacion de los textos del instalador
        shell: pwsh
        run: |
          # Windows PowerShell 5.1, que es el que ejecuta los scripts en los PCs, e
          # Inno Setup leen como ANSI un archivo UTF-8 sin BOM: cada tilde saldria
          # como "Ã³" en los mensajes, en el asistente y en el nombre del servicio.
          # Este job usa PowerShell 7, que no tiene el problema, asi que sin esta
          # comprobacion no se notaria hasta instalarlo en un PC.
          $mal = Get-ChildItem installer -Recurse -Include *.ps1, *.iss, *.txt | Where-Object {
            $b = [System.IO.File]::ReadAllBytes($_.FullName)
            $bom = $b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF
            $noAscii = [bool]($b | Where-Object { $_ -gt 127 } | Select-Object -First 1)
            $noAscii -and -not $bom
          }
          if ($mal) { throw "Con tildes y sin BOM UTF-8: $($mal.Name -join ', ')" }
          Write-Host 'Codificacion correcta.'

      - name: Comprobar la sintaxis de los scripts de PowerShell
        shell: pwsh
        run: |
          $errores = @()
          Get-ChildItem installer/scripts/*.ps1 | ForEach-Object {
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errores)
            if ($errores) { throw "$($_.Name): $($errores[0].Message)" }
          }
          Write-Host 'Scripts de PowerShell sin errores de sintaxis.'

  construir:
    needs: validar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolver la versión del collector
        id: collector
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PEDIDA: ${{ inputs.collector_version }}
        run: |
          $v = $env:PEDIDA
          if ([string]::IsNullOrWhiteSpace($v)) {
            # Sin versión fija se toma la última. Para producción conviene fijarla,
            # una vez revisado un binario concreto.
            $rel = gh api repos/open-telemetry/opentelemetry-collector-releases/releases/latest | ConvertFrom-Json
            $v = $rel.tag_name
            Write-Host "Última versión: $v"
          }
          $bare = $v.TrimStart('v')
          "tag=$v"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "bare=$bare" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Descargar el collector y verificar el checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.collector.outputs.tag }}
          BARE: ${{ steps.collector.outputs.bare }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build/collector | Out-Null
          $base = "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/$env:TAG"
          $archivo = "otelcol-contrib_${env:BARE}_windows_amd64.tar.gz"

          Invoke-WebRequest "$base/$archivo" -OutFile "build/$archivo"

          # Como se publican los checksums ha cambiado entre versiones del proyecto:
          # las recientes dan un `.sha256` por archivo, las antiguas un archivo comun.
          # Se aceptan los dos, buscandolos en la lista de la release. Sin checksum la
          # construccion falla: este binario acaba en todos los PCs de la empresa, y
          # descargarlo sin comprobarlo seria confiar en la red.
          $assets = (gh api "repos/open-telemetry/opentelemetry-collector-releases/releases/tags/$env:TAG" | ConvertFrom-Json).assets
          $propio = $assets | Where-Object { $_.name -eq "$archivo.sha256" } | Select-Object -First 1
          if ($propio) {
            Write-Host "Checksum: $($propio.name)"
            Invoke-WebRequest $propio.browser_download_url -OutFile build/checksum.txt
            $esperado = ((Get-Content build/checksum.txt -Raw).Trim() -split '\s+')[0]
          } else {
            $sumas = $assets | Where-Object { $_.name -like '*otelcol-contrib*checksums*.txt' } | Select-Object -First 1
            if (-not $sumas) {
              $candidatos = ($assets.name | Where-Object { $_ -like 'otelcol-contrib*windows*' }) -join ', '
              throw "La release $env:TAG no publica checksum de $archivo. Disponibles: $candidatos"
            }
            Write-Host "Checksums: $($sumas.name)"
            Invoke-WebRequest $sumas.browser_download_url -OutFile build/checksums.txt
            $esperado = (Select-String -Path build/checksums.txt -Pattern ([regex]::Escape($archivo)) |
                         Select-Object -First 1).Line.Split(' ')[0]
          }
          if (-not $esperado) { throw "No se encontró el checksum de $archivo" }

          $real = (Get-FileHash "build/$archivo" -Algorithm SHA256).Hash.ToLower()
          if ($real -ne $esperado.ToLower()) {
            throw "Checksum distinto. Esperado $esperado, obtenido $real"
          }
          Write-Host "Checksum verificado: $real"

          tar -xzf "build/$archivo" -C build/collector
          if (-not (Test-Path build/collector/otelcol-contrib.exe)) {
            throw 'El archivo descargado no contiene otelcol-contrib.exe'
          }

      - name: Compilar el instalador
        shell: pwsh
        env:
          AGENT_VERSION: ${{ inputs.agent_version || '0.1.0' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:AGENT_VERSION
          # En una etiqueta, la versión sale de la etiqueta.
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}' -replace '^agente-v', ''
          }
          Write-Host "Versión del agente: $version"

          # Inno Setup viene preinstalado en windows-latest vía Chocolatey.
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "No se encontró ISCC en $iscc" }

          & $iscc "/DAgentVersion=$version" "/DCollectorDir=..\build\collector" installer\medicion-agent.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló con código $LASTEXITCODE" }

          Get-ChildItem dist

      - name: Publicar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: instalador-agente
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
